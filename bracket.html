<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tournament Bracket</title>
<!-- Tournament tool (2026-10-21): Swiss / Single / Double elimination / Round robin, tie-breakers, clans from /clans.html.
     One self-contained file: "Save & Share" downloads a copy of this page with the bracket built in (no server needed). -->
<style>
:root{--bg:#050a16;--text:#e9f1ff;--muted:#7f8fb0;--blue:#2b8cff;--green:#19d37a;--yellow:#ffc933;--red:#ff3b57;--cyan:#35d0ff;--gold:#ffb020;--purple:#a78bfa;--line:rgba(43,140,255,.35)}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--text);min-height:100vh;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1200px 500px at 50% -10%,rgba(43,140,255,.18),transparent 60%),radial-gradient(900px 500px at 100% 100%,rgba(25,211,122,.07),transparent 60%),var(--bg)}
button,input,select{font-family:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- top ---------- */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(5,10,22,.85);position:sticky;top:0;z-index:20}
.bar .sp{flex:1}
.bar a{color:inherit;text-decoration:none}
.btn{cursor:pointer;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);padding:7px 13px;border-radius:9px;font-weight:700;font-size:13.5px;transition:.15s}
.btn:hover{background:rgba(255,255,255,.13)}
.btn.primary{background:linear-gradient(135deg,#19d37a,#0b9f9a);border-color:transparent;color:#03140d}
.btn.sm{padding:3px 9px;font-size:12.5px;border-radius:7px}
.btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
select,input[type=number],input[type=text]{background:#0a1430;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 8px;font-size:13.5px}
input[type=number]{width:64px}
.status{font-size:12.5px;color:var(--muted)}
.status.warn{color:#ffb347}
.top{max-width:1400px;margin:0 auto;padding:16px 20px 4px;text-align:center}
.title{width:100%;max-width:980px;background:transparent;border:0;border-bottom:2px dashed transparent;color:#fff;text-align:center;font-size:clamp(24px,4vw,50px);font-weight:900;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 22px rgba(43,140,255,.65),0 3px 0 rgba(0,0,0,.5);outline:none;padding:2px 8px}
.title:hover,.title:focus{border-bottom-color:rgba(255,255,255,.3)}
.rule{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:12px;align-items:center;margin-top:6px;padding:7px 22px;border:1px solid rgba(43,140,255,.5);border-radius:12px;background:rgba(10,20,45,.8);font-weight:800;letter-spacing:1.5px;font-size:14px}
.rule .g{color:var(--green)}.rule .r{color:var(--red)}.rule .c{color:var(--cyan)}.rule i{opacity:.5;font-style:normal}
.rule .bos{flex-basis:100%;text-align:center;font-size:12.5px;letter-spacing:1px;color:#ffd36a}
/* Match length (user 2026-10-28): Bo1 grey, Bo3+ gold, Final gold filled */
.match .bo{position:absolute;top:-9px;right:12px;background:#07102a;border:1px solid rgba(255,255,255,.25);color:var(--muted);font-size:10px;font-weight:900;letter-spacing:1.5px;padding:1px 7px;border-radius:6px}
.match .bo.big{border-color:var(--gold);color:var(--gold)}
.match .bo.fin{background:var(--gold);color:#1a1000;border-color:var(--gold)}
/* LIVE NOW / ONGOING (user 2026-10-28): click a match box (not ✔ ✖ or the score) for the menu */
.match.pick{cursor:pointer}.match.pick:hover{box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.match.st-live{border-color:#ff3b57;box-shadow:0 0 0 2px #ff3b57,0 0 22px rgba(255,59,87,.55)}
.match.st-play{border-color:#ffb020;box-shadow:0 0 0 1.5px #ffb020,0 0 14px rgba(255,176,32,.35)}
.match .stb{position:absolute;top:-10px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:900;letter-spacing:1.5px;padding:1px 8px;border-radius:6px}
.match .stb.live{background:#ff3b57;color:#fff;animation:livePulse 1.4s ease-in-out infinite}.match .stb.play{background:#ffb020;color:#1a1000}
.match .stb.live::before{content:'';display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:50%;background:#fff;vertical-align:1px}
@keyframes livePulse{50%{opacity:.6}}
.mmenu{position:fixed;z-index:55;min-width:230px;background:#0d1a38;border:1px solid var(--blue);border-radius:12px;padding:8px;box-shadow:0 14px 40px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:6px}
.mmenu .mh{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--muted);padding:2px 4px 4px}
.mmenu button{text-align:left}.mmenu button.on{outline:2px solid #fff}
.mmenu .note{padding:2px 4px}

/* ---------- settings + teams panel ---------- */
.panel{max-width:1400px;margin:14px auto 0;padding:0 16px}
.card{border:1px solid var(--line);border-radius:14px;background:rgba(8,15,34,.85);padding:12px 14px;margin-bottom:12px}
.card>h2{margin:0 0 8px;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;color:#cfe0ff;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.card>h2 small{font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);font-size:12.5px}
.card.fold>:not(h2){display:none}
.card>h2::before{content:'\25BE';font-size:12px;color:var(--muted)}
.card.fold>h2::before{content:'\25B8'}
.card>h2 .btn{margin-left:auto;letter-spacing:0;text-transform:none}
.prow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:6px 0}
.prow label{display:flex;gap:6px;align-items:center;font-size:13.5px;color:#b8c7e6}
.prow .grp{display:flex;gap:4px;align-items:center}
.note{color:var(--muted);font-size:12.5px;line-height:1.5}
.clans{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.clan{display:flex;gap:6px;align-items:center;padding:3px 9px 3px 4px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);cursor:pointer;font-size:12.5px;font-weight:700}
.clan:hover{border-color:var(--green)}
.clan.used{opacity:.4}
.clan img,.clan .lt{width:22px;height:22px;border-radius:50%;object-fit:contain;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:11px}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px}
.seat{display:flex;gap:6px;align-items:center;padding:4px 6px;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:rgba(255,255,255,.04)}
.seat.sel{border-color:var(--green);box-shadow:0 0 10px rgba(25,211,122,.4)}
.seat.over{outline:2px dashed #fff}
.seat .no{width:24px;text-align:right;color:var(--muted);font-size:12px;font-weight:800}
.seat .grip{cursor:grab;color:var(--muted);letter-spacing:-3px;user-select:none}
.seat{min-width:0}
.seat input.nm{flex:1;min-width:0;width:0}
.seat input.tg{width:62px;text-transform:uppercase}
.seat .lg{width:32px;height:32px;flex:none;border-radius:8px;cursor:pointer;display:grid;place-items:center;overflow:hidden;outline:1px dashed rgba(255,255,255,.35);background:rgba(255,255,255,.06);font-weight:900;font-size:13px}
.seat .lg img{width:100%;height:100%;object-fit:contain}
.seat .lg.drag{outline-color:var(--green)}
.bench{margin-top:8px}
.bench>b{font-size:12.5px;color:var(--muted)}

/* ---------- stage ---------- */
.zoom{display:flex;gap:4px;justify-content:center;margin:4px 0 0}
.scroller{overflow:auto;padding:14px 10px 10px}
.scroller.pan{cursor:grab}
.scroller.panning{cursor:grabbing;user-select:none}
.hbar{position:sticky;bottom:0;z-index:20;overflow-x:auto;overflow-y:hidden;height:16px;background:rgba(5,10,24,.9);border-top:1px solid var(--line)}
.hbar>div{height:1px}
.sizer{margin:0 auto;overflow:hidden}
.stage{position:relative;width:max-content;padding:14px 20px 20px;transform-origin:top left}
svg.arrows{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
.sec{position:relative;z-index:1}
svg.arrows path{fill:none;stroke-width:2.4;stroke-linecap:round}
svg.arrows path.w{stroke:var(--green);filter:drop-shadow(0 0 4px rgba(25,211,122,.9))}
svg.arrows path.l{stroke:var(--red);filter:drop-shadow(0 0 4px rgba(255,59,87,.9))}
svg.arrows path.off{stroke:#7f8fb0;opacity:.35;stroke-dasharray:3 7}
svg.arrows circle.w{fill:var(--green)}svg.arrows circle.l{fill:var(--red)}svg.arrows circle.off{fill:#7f8fb0;opacity:.4}
.sec{margin-bottom:34px}
.sec>h2{margin:0 0 12px;font-size:20px;letter-spacing:3px;text-transform:uppercase;color:#fff;text-shadow:0 0 14px rgba(43,140,255,.6)}
.cols{display:flex;gap:54px;align-items:flex-start}
.col{width:280px;display:flex;flex-direction:column;gap:20px}
.colh{font-size:12px;letter-spacing:2.5px;color:var(--muted);font-weight:800;text-align:center;margin-bottom:-8px}
.tree{display:flex;gap:54px;align-items:stretch}
.tcol{width:260px;display:flex;flex-direction:column}
.tcol .colh{margin:0 0 6px}
.tbody{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.group{--gc:var(--blue);border:1.5px solid var(--gc);border-radius:14px;background:rgba(9,17,36,.88);overflow:hidden;box-shadow:0 0 18px color-mix(in srgb,var(--gc) 28%,transparent)}
.blue{--gc:var(--blue)}.green{--gc:var(--green)}.yellow{--gc:var(--yellow)}.red{--gc:var(--red)}.purple{--gc:var(--purple)}.cyan{--gc:var(--cyan)}.gold{--gc:var(--gold)}
.group>h3{margin:0;padding:7px 10px;text-align:center;font-size:21px;font-weight:900;letter-spacing:2px;color:#fff;background:linear-gradient(180deg,var(--gc),color-mix(in srgb,var(--gc) 50%,#000));text-shadow:0 1px 3px rgba(0,0,0,.55)}
.group>h3 small{font-size:13px;letter-spacing:1.2px;margin-left:8px;opacity:.95}
.gbody{padding:4px 0 8px;display:flex;flex-direction:column}
.match{position:relative;display:flex;gap:8px;align-items:center;margin:14px 10px 4px;padding:9px 8px;border:1.5px solid color-mix(in srgb,var(--gc) 70%,transparent);border-radius:12px;background:rgba(4,9,20,.82)}
.tree .match{margin:8px 0}
.match.bye{opacity:.45}
.match .mid{position:absolute;top:-9px;left:12px;background:#07102a;border:1px solid color-mix(in srgb,var(--gc) 60%,transparent);color:var(--gc);font-size:10px;font-weight:800;letter-spacing:1.5px;padding:1px 7px;border-radius:6px}
.slots{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.vs{font-size:9.5px;letter-spacing:3px;text-align:center;color:var(--muted);line-height:1;font-weight:700}
.slot{position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:4px 6px;border:1px solid rgba(255,255,255,.13);border-radius:9px;background:rgba(255,255,255,.045)}
.slot.empty{opacity:.6;border-style:dashed}
.slot.empty .name{font-style:italic;color:var(--muted);font-weight:500;font-size:12.5px}
.slot.win{border-color:var(--green);background:rgba(25,211,122,.14);box-shadow:0 0 11px rgba(25,211,122,.45)}
.slot.lose{border-color:rgba(255,59,87,.55);background:rgba(255,59,87,.07)}
.slot.lose .name,.slot.lose .logo{opacity:.5}
.slot.lose .name{text-decoration:line-through}
.slot.res{margin:8px 10px 0;background:color-mix(in srgb,var(--gc) 15%,transparent);border-color:var(--gc)}
.slot.champ{height:54px;border-color:var(--gold);background:rgba(255,176,32,.14);box-shadow:0 0 16px rgba(255,176,32,.5)}
.slot.champ .name{font-size:18px}
.champbox{position:relative}
.champbox .note{position:absolute;top:100%;left:0;right:0;margin-top:8px;text-align:center}
.champbox .note b{color:#fff;font-weight:700}
/* 3rd place match (TODO 32): under the Final in its column, played before it (lower match number) */
.finbox{position:relative}
.thirdbox{position:absolute;top:100%;left:0;right:0;margin-top:22px}
.thirdbox .colh{margin:0 0 14px}
.tree.has3rd{padding-bottom:150px}
.logo{width:30px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.04));font-weight:900;font-size:14px;color:#cfe0ff}
.logo img{width:100%;height:100%;object-fit:contain}
.name{flex:1;min-width:0;font-weight:700;font-size:15px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name small{font-size:11px;color:var(--muted);margin-left:5px;font-weight:700}
.rec{font-size:11px;font-weight:800;color:var(--muted)}
input.sc{width:34px;height:26px;padding:0 2px;text-align:center;font-weight:800;font-size:14px;border-radius:6px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18)}
input.sc::-webkit-inner-spin-button{display:none}
.acts{position:absolute;right:46px;top:50%;transform:translateY(-50%);display:flex;gap:4px;padding:3px;background:rgba(7,14,32,.94);border-radius:9px;box-shadow:0 0 8px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .12s;z-index:3}
.slot:hover .acts,.slot:focus-within .acts{opacity:1;pointer-events:auto}
.acts button{width:25px;height:25px;border-radius:7px;border:1.5px solid;background:#0a1630;cursor:pointer;font-size:13px;line-height:1;padding:0}
.acts .ok{color:var(--green);border-color:var(--green)}.acts .no{color:var(--red);border-color:var(--red)}
.acts .ok.active{background:var(--green);color:#03140d}.acts .no.active{background:var(--red);color:#fff}
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;width:min(1360px,96vw)}
.rounds .group .match{margin:14px 10px 4px}
table.st{border-collapse:collapse;min-width:520px;font-size:14px;margin-bottom:6px}
table.st th{font-size:11px;letter-spacing:1.5px;color:var(--muted);text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
table.st td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
table.st td.n{text-align:center;font-weight:800}
table.st .tm{display:flex;gap:8px;align-items:center;font-weight:700}
table.st .tm .logo{width:24px;height:24px;font-size:11px}
table.st tr.q td:first-child{box-shadow:inset 3px 0 var(--green)}
table.st tr.e td:first-child{box-shadow:inset 3px 0 var(--red)}
.chip{padding:2px 9px;border-radius:7px;border:1.5px solid;font-weight:800;font-size:11px;letter-spacing:1px;white-space:nowrap}
.chip.q{color:var(--green);border-color:var(--green)}.chip.e{color:var(--red);border-color:var(--red)}.chip.t{color:var(--yellow);border-color:var(--yellow);cursor:pointer;background:none}
.wait{color:var(--muted);font-style:italic;font-size:13px;padding:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:50;background:#0d1a38;border:1px solid var(--blue);color:#fff;padding:11px 18px;border-radius:11px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:.25s;max-width:90vw;text-align:center}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.modal .box{background:#0d1a38;border:1px solid var(--blue);border-radius:14px;padding:18px 20px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.modal p{margin:0 0 14px;white-space:pre-line;line-height:1.5;font-size:15px}
.modal input{width:100%;margin-bottom:14px}
/* ⇅ Order window (user 2026-10-28): drag a row or use its arrows */
.olist{display:grid;gap:6px;margin:0 0 14px;max-height:55vh;overflow:auto}
.orow{display:flex;align-items:center;gap:8px;padding:8px 10px;touch-action:none;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.04);cursor:grab;user-select:none}
.orow.drag{opacity:.45;border-style:dashed}.orow b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.orow .grip{opacity:.6;font-size:18px}.orow.cur{border-color:var(--blue)}
.mrow{display:flex;gap:8px;justify-content:flex-end}
.btn.trash{padding:3px 7px}
.filebar{max-width:1400px;margin:10px auto 0;padding:10px 14px;border:1px solid #ffb347;border-radius:12px;background:rgba(255,179,71,.08);color:#ffd59a;font-size:13.5px;text-align:center}
.filebar a{color:#fff;font-weight:800}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hostbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.hostbar .sp{flex:1}.hostbar .btn.on{background:#c0283a;border-color:#ff5a6a;color:#fff}
.hb-conn{color:#3ddc84}.hb-conn.warn{color:#ffb44d}
/* Bracket-Control card on /control (?view=control): only the bracket, the bracket list and the presses */
body.ctl .bar>a,body.ctl .bar>.btn,body.ctl #panel,body.ctl header.top{display:none}
body.ctl .bar{padding:6px 10px}
@media(max-width:700px){.bar{padding:8px}.panel{padding:0 8px}.seats{grid-template-columns:1fr}}
</style>
</head>

<script>
(function(){

/*core{*/
const BYE = -1, MAXT = 64;

/*}core*/
// SERVED = opened from Scrim Overlay on this PC (Clans list, Back to Control). WEB = the online copy anyone can use

const WEB = /^https?:$/.test(location.protocol) && !/^(127\.0\.0\.1|localhost|\[::1\])$/.test(location.hostname),
  SERVED = /^https?:$/.test(location.protocol) && !WEB && /bracket\.html$/.test(location.pathname);
const $ = s => document.querySelector(s);

// brackets" switches back to the free tool (its brackets stay apart: different storage key). No PIN = the free tool.
const ls = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} } };
let COCFG = null; try{ COCFG = JSON.parse(document.getElementById('cohost-cfg').textContent || 'null'); }catch(e){}

/*core{*/

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;

/* ================= storage ================= */
function blankTeam(){ return {name:'', tag:'', logo:null}; }
function newBracket(teams){
  return { id:uid(), title:'Scrim Tournament', savedAt:Date.now(), format:'swiss', count:8,
    teams:(teams || []).map(t => ({...t})).concat(Array.from({length:Math.max(0, 8 - (teams || []).length)}, blankTeam)),
    opt:{wins:3, losses:3, seeding:'listed', playoff:'single', third:true, third2:1, bo:{swiss:1, decide:3, po:5, third:5, final:7}, reset:true, rrTwice:false, rrGroups:1, rrAdvance:2, tb:['tbm','h2h','diff','buch']},
    results:{}, tbs:[] };
}
function fix(b){
  const d = newBracket();
  const old3 = b && b.opt && !b.opt.third2; // saved before the 3rd place match came on by default (2026-10-28)
  b = Object.assign(d, b || {}); b.opt = Object.assign(newBracket().opt, b.opt || {});
  b.opt.bo = Object.assign(newBracket().opt.bo, b.opt.bo || {});
  if(old3){ b.opt.third2 = 1; if(b.format === 'swiss') b.opt.third = true; }
  if(!Array.isArray(b.teams)) b.teams = [];

  b.teams = b.teams.slice(0, MAXT).map(t => Object.assign({name:String(t && t.name || '').slice(0, 30), tag:String(t && t.tag || '').slice(0, 6), logo:t && t.logo || null},
    t && /^[a-z0-9]{1,30}$/i.test(String(t.clan || '')) ? {clan:String(t.clan)} : {}));
  b.count = Math.max(2, Math.min(MAXT, +b.count || 8));
  while(b.teams.length < b.count) b.teams.push(blankTeam());
  if(!FORMATS[b.format]) b.format = 'swiss';
  if(!b.results || typeof b.results !== 'object') b.results = {};

/*}core*/
let S;

  if(!have){ S.list.push(fix(EMB.bracket)); S.cur = EMB.bracket.id; }
  else if(seen !== EMB.stamp && (EMB.bracket.savedAt || 0) > (have.savedAt || 0)) askEmb = have;

  const u = used(); Object.keys(S.logos).forEach(k => { if(!u.has(k)) delete S.logos[k]; });

  catch(e){ status('⚠ Browser storage full – use Save & Share', true); }

function countQualified(n, W, L){ // how many teams reach W wins when every match is played (simulation of record groups)
  let g = {'0-0':n}, q = 0;
  for(let r = 0; r < W + L; r++){ const nx = {};

      const add = (kk, v) => { if(!v) return; const [ww, ll] = kk.split('-').map(Number); if(ww >= W) q += v; else if(ll < L) nx[kk] = (nx[kk] || 0) + v; };
      add((w + 1) + '-' + l, win); add(w + '-' + (l + 1), lose); });
    g = nx; }
  return q;
}

function drawLinks(){
  if(!stage || !svg) return;
  const sr = stage.getBoundingClientRect(), k = (sr.width / stage.offsetWidth) || 1;
  const X = v => (v - sr.left) / k, Y = v => (v - sr.top) / k;
  svg.setAttribute('width', stage.offsetWidth); svg.setAttribute('height', stage.offsetHeight);
  let html = '';

    const cr = L.from.getBoundingClientRect(), fr = (L.fromSlot || L.from).getBoundingClientRect(), tr = L.to.getBoundingClientRect();
    if(!cr.width || !tr.width) return;
    const x1 = X(cr.right), y1 = Y(fr.top + fr.height / 2), x2 = X(tr.left) - 3, y2 = Y(tr.top + tr.height / 2), dx = Math.max(22, (x2 - x1) * .5);
    html += '<path class="' + L.cls + '" d="M' + x1 + ' ' + y1 + ' C' + (x1 + dx) + ' ' + y1 + ' ' + (x2 - dx) + ' ' + y2 + ' ' + x2 + ' ' + y2 + '"/><circle class="' + L.cls + '" cx="' + x1 + '" cy="' + y1 + '" r="3.2"/>'; });
  svg.innerHTML = html;

function layout(){

  const w = stage.offsetWidth, hh = stage.offsetHeight, avail = sizer.parentNode.clientWidth - 20;
  const z = S.zoom === 'fit' ? Math.max(.45, Math.min(1, avail / w)) : +S.zoom || 1;

// Zoomed in, the bracket is wider than the window: a left-right bar stays at the bottom of the screen

function hbarSync(){
  const sc = $('.scroller'), bar = $('.hbar'); if(!sc || !bar) return;
  const wide = sc.scrollWidth > sc.clientWidth + 2;
  bar.hidden = !wide; sc.classList.toggle('pan', wide);
  bar.firstChild.style.width = sc.scrollWidth + 'px'; bar.scrollLeft = sc.scrollLeft;
}
function panSetup(){
  const sc = $('.scroller'), bar = $('.hbar'); let drag = null;
  const mirror = (from, to) => from.addEventListener('scroll', () => { if(to.scrollLeft !== from.scrollLeft) to.scrollLeft = from.scrollLeft; });
  mirror(sc, bar); mirror(bar, sc);
  sc.addEventListener('pointerdown', e => {
    if(e.button !== 0 || e.pointerType === 'touch' || !sc.classList.contains('pan') || e.target.closest('button,input,select,a,label,.acts')) return;
    drag = {x:e.clientX, y:e.clientY, l:sc.scrollLeft, moved:false, id:e.pointerId};
  });
  addEventListener('pointermove', e => {
    if(!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if(!drag.moved && Math.abs(dx) + Math.abs(dy) < 6) return;
    if(!drag.moved){ drag.moved = true; sc.classList.add('panning'); }
    sc.scrollLeft = drag.l - dx; scrollBy(0, -(e.movementY || 0));
  });
  addEventListener('pointerup', () => {
    if(!drag) return;
    if(drag.moved){ // a slide is not a click on a team
      const eat = e => { e.stopPropagation(); e.preventDefault(); };
      addEventListener('click', eat, {capture:true, once:true}); setTimeout(() => removeEventListener('click', eat, true), 0);
    }
    drag = null; sc.classList.remove('panning');
  });
}

    h('input', {class:'nm', type:'text', maxlength:'30', placeholder:'Team ' + (i + 1), value:t.name, spellcheck:'false', oninput:e => { t.name = e.target.value; touch(); renderBracket(); }}),
    h('input', {class:'tg', type:'text', maxlength:'6', placeholder:'TAG', value:t.tag, spellcheck:'false', oninput:e => { t.tag = e.target.value; touch(); renderBracket(); }}),
    t.logo ? h('button', {class:'btn sm', type:'button', title:'Remove this logo (the team stays)', onclick:e => { e.stopPropagation(); t.logo = null; changed(); }}, '✕') : null,
    h('button', {class:'btn sm trash', type:'button', title:'Remove this team from the bracket', onclick:e => { e.stopPropagation(); removeSeat(i); }}, '🗑'));
  const grip = row.querySelector('.grip');
  grip.addEventListener('dragstart', e => { dragSeat = i; e.dataTransfer.setData('text/plain', 'seat'); e.dataTransfer.effectAllowed = 'move'; });
  row.addEventListener('dragover', e => { if(dragSeat >= 0){ e.preventDefault(); row.classList.add('over'); } });
  row.addEventListener('dragleave', () => row.classList.remove('over'));
  row.addEventListener('drop', e => { row.classList.remove('over'); if(dragSeat < 0 || dragSeat === i) return; e.preventDefault();
    const a = B.teams[dragSeat]; B.teams[dragSeat] = B.teams[i]; B.teams[i] = a; dragSeat = -1; changed(); });
  grip.addEventListener('dragend', () => { dragSeat = -1; });
  return row;
}
let pickFor = -1;
// results are kept per seat, so empty seats cannot keep them
async function clearTeams(){
  const B = cur();
  if(!await dialog('Clear all teams of "' + B.title + '"?\nEvery seat (and the bench) is emptied and all match results are cleared.\nFormat and rules stay.', {yes:'Clear teams', no:'Cancel'})) return;
  B.teams = Array.from({length:B.count}, blankTeam); B.results = {}; B.tbs = [];
  selSeat = -1; changed(); toast('Teams cleared.');
}
async function clearAll(){
  const B = cur();
  if(!await dialog('Reset ALL of "' + B.title + '"?\nFormat, rules and team count go back to the start (Swiss, 8 teams), all teams are cleared and all match results are deleted.\nThe bracket name stays.', {yes:'Reset all', no:'Cancel'})) return;
  const d = newBracket(); Object.assign(B, {format:d.format, count:d.count, teams:d.teams, opt:d.opt, results:{}, tbs:[]});
  selSeat = -1; changed(); renderList(); toast('Bracket reset.');
}
async function removeSeat(i){
  const B = cur(), t = B.teams[i], nm = (t.name || '').trim() || 'Team ' + (i + 1), later = i < B.count && Object.keys(B.results).length;
  if(!await dialog('Remove ' + nm + ' from this bracket?' + (later ? '\nThe teams after it move up one seat, so some results may move to other teams.' : ''), {yes:'Remove', no:'Cancel'})) return;
  B.teams.splice(i, 1); if(i < B.count) B.count = Math.max(2, B.count - 1);
  while(B.teams.length < B.count) B.teams.push(blankTeam());
  selSeat = -1; changed(); toast(nm + ' removed.');
}
async function setLogoFile(i, f){
  if(!f || !/^image\//.test(f.type)) return toast('That is not a picture.');
  const u = URL.createObjectURL(f);
  try{ cur().teams[i].logo = await putLogo(u); changed(); }catch(e){ toast('Could not read that picture.'); }
  URL.revokeObjectURL(u);
}
function emptySeat(B){ for(let i = 0; i < B.count; i++){ const t = B.teams[i]; if(!t.name.trim() && !t.logo) return i; } return -1; }
async function clanTeam(c){ return Object.assign({name:c.name || c.tag, tag:c.tag || '', logo:c.logo ? await putLogo(c.logo).catch(() => null) : null}, c.id ? {clan:c.id} : {}); }
async function pickClan(c){
  const B = cur(); let i = selSeat >= 0 ? selSeat : emptySeat(B);
  if(i < 0){ if(B.count >= MAXT) return toast('All ' + MAXT + ' seats are full.'); i = B.count; setCount(B, B.count + 1); }
  B.teams[i] = await clanTeam(c);
  selSeat = selSeat >= 0 && selSeat + 1 < B.count ? selSeat + 1 : -1;
  changed();
}
async function addAllClans(){
  const B = cur(), have = new Set(B.teams.slice(0, B.count).map(t => (t.tag || t.name || '').toUpperCase()).filter(Boolean));
  const todo = CLANS.filter(c => (c.name || c.tag) && !have.has((c.tag || c.name).toUpperCase()));
  if(!todo.length) return toast('Every clan is already in.');
  let added = 0;
  for(const c of todo){ let i = emptySeat(B); if(i < 0){ if(B.count >= MAXT) break; i = B.count; B.count++; while(B.teams.length < B.count) B.teams.push(blankTeam()); }
    B.teams[i] = await clanTeam(c); added++; }
  toast(added + ' clan(s) added. Team count is now ' + B.count + '.'); changed();
}
async function shuffle(){
  const B = cur(); if(Object.keys(B.results).length && !await dialog('Shuffle the seeds? Teams change places, so the results stay with the seats (better use Reset results first).')) return;
  const a = B.teams.slice(0, B.count); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  B.teams.splice(0, B.count, ...a); changed();
}

/* ================= brackets list, share, import ================= */
// ⇅ Order (user 2026-10-28): the bracket list in the order you want, by dragging a row (mouse / pen / finger) or with
// its ↑ ↓ arrows. Saved like any change, so every PC tab, the Bracket-Control card and the co-hosts get the same order.
function orderDialog(){
  let order = S.list.slice(), dragged = null;
  const list = h('div', {class:'olist'});
  const draw = () => { list.innerHTML = ''; order.forEach((b, i) => {
    const row = h('div', {class:'orow' + (b.id === S.cur ? ' cur' : ''), 'data-i':i},
      h('span', {class:'grip'}, '⠿'), h('b', {}, (b.title || 'Untitled') + ' · ' + FORMATS[b.format]),
      h('button', {class:'btn sm', type:'button', title:'Up', disabled:!i, onclick:() => move(i, i - 1)}, '↑'),
      h('button', {class:'btn sm', type:'button', title:'Down', disabled:i === order.length - 1, onclick:() => move(i, i + 1)}, '↓'));
    // Drag: the row itself moves between the others (it keeps the pointer), the arrows are redrawn on release.
    row.addEventListener('pointerdown', e => { if(e.target.closest('button')) return; dragged = row; row.classList.add('drag'); row.setPointerCapture(e.pointerId); });
    row.addEventListener('pointermove', e => { if(dragged !== row) return;
      const over = document.elementsFromPoint(e.clientX, e.clientY).map(x => x.closest && x.closest('.orow')).find(x => x && x !== row && list.contains(x));
      if(!over) return;
      const rows = [...list.children], i = rows.indexOf(row), j = rows.indexOf(over);
      const [b] = order.splice(i, 1); order.splice(j, 0, b);
      list.insertBefore(row, j > i ? over.nextSibling : over); });
    const end = () => { if(dragged !== row) return; dragged = null; draw(); };
    row.addEventListener('pointerup', end); row.addEventListener('pointercancel', end);
    list.append(row); }); };
  const move = (i, j) => { if(j < 0 || j >= order.length || i === j) return; const [b] = order.splice(i, 1); order.splice(j, 0, b); draw(); };
  draw();
  const ov = h('div', {class:'modal', onclick:e => { if(e.target === ov) ov.remove(); }}, h('div', {class:'box'}, h('p', {}, 'Bracket order: drag a bracket, or use ↑ ↓.'), list,
    h('div', {class:'mrow'}, h('button', {class:'btn primary', type:'button', onclick:() => { ov.remove();
      if(order.map(b => b.id).join() === S.list.map(b => b.id).join()) return;
      S.list = order; touch(); renderList(); toast('Order saved.'); }}, 'Save order'), h('button', {class:'btn', type:'button', onclick:() => ov.remove()}, 'Cancel'))));
  document.body.append(ov);
}
function renderList(){
  const s = $('#which'); s.innerHTML = '';
  S.list.forEach(b => s.append(h('option', {value:b.id, selected:b.id === S.cur}, (b.title || 'Untitled') + ' · ' + FORMATS[b.format])));
}
async function newFrom(copyResults){
  const B = cur(), name = await dialog(copyResults ? 'Name of the copy' : 'Name of the new bracket (same teams, no results)', {input:B.title + (copyResults ? ' (copy)' : ' 2'), yes:'Create', no:'Cancel'});
  if(name == null) return;
  const nb = fix(JSON.parse(JSON.stringify(B))); nb.id = uid(); nb.title = name.slice(0, 60) || 'Scrim Tournament'; nb.savedAt = Date.now();
  if(!copyResults){ nb.results = {}; nb.tbs = []; }
  S.list.push(nb); S.cur = nb.id; touch(); renderAll();
}
// 🗑 Delete (user 2026-10-28). Synced pages send the id as `gone`: the PC removes it for every page and co-host and
// remembers it, so an older list cannot bring it back. Its copies stay in data\bracket\old. Last one = a fresh blank one.
let GONE = [];
async function delBracket(){
  const B = cur();
  if(!await dialog('Delete "' + (B.title || 'Untitled') + ' · ' + FORMATS[B.format] + '"?\nIts teams, results and settings go away' + (SYNC ? ' for everyone.' : '.'), {yes:'Delete', no:'Cancel'})) return;
  const at = S.list.indexOf(B); S.list.splice(at, 1); GONE.push(B.id);
  if(!S.list.length) S.list.push(newBracket());
  S.cur = S.list[Math.min(at, S.list.length - 1)].id; selSeat = -1;
  touch(); renderAll(); toast('Deleted "' + (B.title || 'Untitled') + '".');
}
function exportHTML(){
  const B = cur(), logos = {}; B.teams.forEach(t => { if(t.logo && S.logos[t.logo]) logos[t.logo] = S.logos[t.logo]; });
  const payload = {v:2, stamp:uid(), savedAt:Date.now(), bracket:B, logos:logos};
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector('#app').innerHTML = '';
  const cfg = clone.querySelector('#cohost-cfg'); if(cfg) cfg.textContent = 'null'; // shared files are free tools only (no co-host link)
  clone.querySelector('#embedded-state').textContent = JSON.stringify(payload).replace(new RegExp('[<' + String.fromCharCode(8232, 8233) + ']', 'g'), c => '\\' + 'u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
  clone.querySelector('title').textContent = B.title || 'Tournament Bracket';
  const blob = new Blob(['<!DOCTYPE html>\n' + clone.outerHTML], {type:'text/html'});
  const slug = (B.title || 'bracket').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'bracket';
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = slug + '.html'; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Downloaded ' + slug + '.html (' + (blob.size / 1048576).toFixed(1) + ' MB) – send THAT file. Names, logos and results are inside.');
}
async function importFile(f){
  try{
    const txt = await f.text(); let d;
    const m = txt.match(/<script[^>]*id="embedded-state"[^>]*>([\s\S]*?)<\/script>/);
    d = JSON.parse(m ? m[1] : txt);
    if(d && d.bracket){ Object.assign(S.logos, d.logos || {}); const nb = fix(d.bracket);
      const at = S.list.findIndex(b => b.id === nb.id); if(at >= 0) S.list[at] = nb; else S.list.push(nb); S.cur = nb.id; }
    else if(d && d.state && Array.isArray(d.state.teams)){ // old "Swiss Bracket - 8 Teams" file: teams + logos
      const teams = [];
      for(const t of d.state.teams){ if(!t || (!(t.name || '').trim() && !t.logo)) continue; teams.push({name:(t.name || '').trim(), tag:'', logo:t.logo ? await putLogo(t.logo).catch(() => null) : null}); }
      const nb = newBracket(teams); nb.title = d.state.title || 'Imported bracket'; nb.count = Math.max(2, Math.min(MAXT, teams.length >= 8 ? 8 : teams.length || 8));
      S.list.push(fix(nb)); S.cur = nb.id; }
    else throw 0;
    touch(); renderAll(); toast('Imported.');
  }catch(e){ toast('That file has no bracket in it.'); }
}

/* ================= page ================= */
function build(){
  const app = $('#app');
  if(CTRL) document.body.classList.add('ctl');
  app.append(
    h('div', {class:'bar'},
      SERVED ? h('a', {href:'/control.html'}, h('button', {class:'btn', type:'button'}, 'Back to Control')) : null,
      h('select', {id:'which', title:'Your saved brackets', onchange:e => { S.cur = e.target.value; selSeat = -1; save(); renderAll(); }}),
      h('button', {class:'btn', type:'button', title:'Start a new bracket with the same teams (this one stays saved)', onclick:() => newFrom(false)}, '+ New bracket'),
      h('button', {class:'btn', type:'button', title:'Copy this bracket with its results', onclick:() => newFrom(true)}, '⧉ Duplicate'),
      h('button', {class:'btn', type:'button', title:'Change the order of your brackets (drag them, or use ↑ ↓)', onclick:orderDialog}, '⇅ Order'),
      h('button', {class:'btn', type:'button', title:'Delete this bracket (teams, results, everything in it)', onclick:delBracket}, '🗑 Delete'),
      h('span', {class:'sp'}),
      h('button', {class:'btn primary', type:'button', title:'Downloads one .html file with this bracket inside, to send to friends', onclick:exportHTML}, '💾 Save & Share (.html)'),
      h('button', {class:'btn', type:'button', title:'Load a shared bracket file (also the old Swiss Bracket file: its teams + logos)', onclick:() => $('#imp').click()}, 'Import file'),
      h('button', {class:'btn', type:'button', title:'Clears the match results only. Teams, logos and settings stay.', onclick:async () => { const B = cur(); if(!Object.keys(B.results).length && !B.tbs.length) return toast('No results to clear.');
        if(await dialog('Clear all match results of "' + B.title + '"?\nTeams, logos and settings stay.', {yes:'Clear results', no:'Cancel'})){ B.results = {}; B.tbs = []; touch(); renderBracket(); } }}, '↺ Reset results'),
      h('span', {class:'status', id:'status'})),
    HOST ? h('div', {class:'filebar hostbar', id:'hostbar'}, h('b', {}, 'Co-host Bracket-Control'), ' · ' + WHO + ' · ', h('span', {class:'hb-conn'}, 'connecting…'),
      ' · On stream: ', h('button', {class:'btn sm', type:'button', 'data-show':'swiss', onclick:() => showOnStream('swiss')}, 'Swiss'),
      h('button', {class:'btn sm', type:'button', 'data-show':'playoffs', onclick:() => showOnStream('playoffs')}, 'Playoffs'), h('span', {class:'hb-on note'}),
      h('span', {class:'sp'}), h('button', {class:'btn sm', type:'button', title:'Back to the free tool: your own brackets in this browser', onclick:() => { ls.set('bracketTool.mode', 'own'); location.reload(); }}, 'My own brackets'))
    : CO && PIN ? h('div', {class:'filebar'}, 'Your own brackets (free tool). ', h('button', {class:'btn sm', type:'button', onclick:() => { ls.set('bracketTool.mode', null); location.reload(); }}, 'Back to the host’s brackets (co-host)'))
    : SERVED ? '' : WEB ? h('div', {class:'filebar'}, CO ? h('button', {class:'btn sm', type:'button', style:'float:right', title:'For co-hosts of the stream: edit the host’s bracket', onclick:askPin}, 'Co-host? Enter PIN') : null, 'Free online bracket tool: your brackets stay in this browser. Save & Share makes one file with the bracket inside; anyone can open it.') : h('div', {class:'filebar'}, 'You opened this as a file, so your Clans list (logos + names, “+ Add all clans”) is not here. Start Scrim Overlay and open ',
      h('a', {href:'http://127.0.0.1:8787/bracket.html'}, 'http://127.0.0.1:8787/bracket.html'), ' (Scrim Control → Bracket). Brackets saved here: Save & Share, then Import file there.'),
    h('header', {class:'top'},
      h('input', {class:'title', id:'title', maxlength:'60', spellcheck:'false', title:'Click to edit the title', oninput:e => { cur().title = e.target.value; document.title = e.target.value || 'Tournament Bracket'; touch(); renderList(); }}),
      h('div', {}, h('div', {class:'rule', id:'rule'}))),
    h('div', {class:'panel', id:'panel'}),
    h('div', {class:'zoom'},
      h('button', {class:'btn sm', type:'button', onclick:() => zoomBy(-.1)}, '−'), h('button', {class:'btn sm', type:'button', id:'zl', onclick:() => { S.zoom = 'fit'; save(); layout(); }}, 'Fit'),
      h('button', {class:'btn sm', type:'button', onclick:() => zoomBy(.1)}, '+'), h('span', {class:'note', style:'margin-left:8px'}, 'Hover a team: ✔ wins · ✖ loses · box = score (optional). Click again to undo. Zoomed in: drag an empty spot to slide.')),
    h('div', {class:'scroller'}, h('div', {class:'sizer'}, stage = h('div', {class:'stage'}))),
    h('div', {class:'hbar', hidden:true}, h('div', {})),
    h('input', {type:'file', id:'file', accept:'image/*', hidden:true, onchange:e => { const f = e.target.files[0]; e.target.value = ''; if(f && pickFor >= 0) setLogoFile(pickFor, f); }}),
    h('input', {type:'file', id:'imp', accept:'.html,.htm,.json', hidden:true, onchange:e => { const f = e.target.files[0]; e.target.value = ''; if(f) importFile(f); }}),
    h('div', {class:'toast', id:'toast'}));
  if('ResizeObserver' in window) new ResizeObserver(() => drawLinks()).observe(stage);
  panSetup();
  addEventListener('resize', layout);
  addEventListener('beforeunload', () => { if(dirty) save(); });
  // Another tab of this tool saved: take its version, so two open tabs never overwrite each other.
  // On this PC (SERVED) the server copy is the truth instead (poll), so this is for the online / file copies only.
  addEventListener('storage', e => { if(SYNC || e.key !== K || !e.newValue) return;
    try{ const o = JSON.parse(e.newValue); if(o && Array.isArray(o.list) && o.list.length){ const z = S.zoom; S = o; S.logos = S.logos || {}; S.list = S.list.map(fix); S.zoom = z;
      if(!S.list.some(b => b.id === S.cur)) S.cur = S.list[0].id; dirty = false; renderAll(); } }catch(err){} });
}
function zoomBy(d){ const sr = stage.getBoundingClientRect(), z = S.zoom === 'fit' ? (sr.width / stage.offsetWidth) : +S.zoom; S.zoom = Math.max(.3, Math.min(1.6, Math.round((z + d) * 10) / 10)); save(); layout(); }
function renderAll(){ renderList(); renderPanel(); renderBracket(); }
build(); renderAll(); save(); loadClans(); if(SYNC) syncStart();
if(askEmb) dialog('This file has a newer version of "' + (EMB.bracket.title || 'this bracket') + '".\nLoad it? (No = keep the one saved in this browser)', {yes:'Load it', no:'Keep mine'})
  .then(ok => { if(!ok) return; S.list[S.list.indexOf(askEmb)] = fix(EMB.bracket); S.cur = EMB.bracket.id; touch(); renderAll(); });
})();
</script>
