<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tournament Bracket</title>
<!-- Tournament tool (2026-10-21): Swiss / Single / Double elimination / Round robin, tie-breakers, clans from /clans.html.
     One self-contained file: "Save & Share" downloads a copy of this page with the bracket built in (no server needed). -->
<style>
:root{--bg:#050a16;--text:#e9f1ff;--muted:#7f8fb0;--blue:#2b8cff;--green:#19d37a;--yellow:#ffc933;--red:#ff3b57;--cyan:#35d0ff;--gold:#ffb020;--purple:#a78bfa;--line:rgba(43,140,255,.35)}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--text);min-height:100vh;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1200px 500px at 50% -10%,rgba(43,140,255,.18),transparent 60%),radial-gradient(900px 500px at 100% 100%,rgba(25,211,122,.07),transparent 60%),var(--bg)}
button,input,select{font-family:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- top ---------- */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(5,10,22,.85);position:sticky;top:0;z-index:20}
.bar .sp{flex:1}
.bar a{color:inherit;text-decoration:none}
.btn{cursor:pointer;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);padding:7px 13px;border-radius:9px;font-weight:700;font-size:13.5px;transition:.15s}
.btn:hover{background:rgba(255,255,255,.13)}
.btn.primary{background:linear-gradient(135deg,#19d37a,#0b9f9a);border-color:transparent;color:#03140d}
.btn.sm{padding:3px 9px;font-size:12.5px;border-radius:7px}
.btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
select,input[type=number],input[type=text]{background:#0a1430;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 8px;font-size:13.5px}
input[type=number]{width:64px}
.status{font-size:12.5px;color:var(--muted)}
.status.warn{color:#ffb347}
.top{max-width:1400px;margin:0 auto;padding:16px 20px 4px;text-align:center}
.title{width:100%;max-width:980px;background:transparent;border:0;border-bottom:2px dashed transparent;color:#fff;text-align:center;font-size:clamp(24px,4vw,50px);font-weight:900;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 22px rgba(43,140,255,.65),0 3px 0 rgba(0,0,0,.5);outline:none;padding:2px 8px}
.title:hover,.title:focus{border-bottom-color:rgba(255,255,255,.3)}
.rule{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:12px;align-items:center;margin-top:6px;padding:7px 22px;border:1px solid rgba(43,140,255,.5);border-radius:12px;background:rgba(10,20,45,.8);font-weight:800;letter-spacing:1.5px;font-size:14px}
.rule .g{color:var(--green)}.rule .r{color:var(--red)}.rule .c{color:var(--cyan)}.rule i{opacity:.5;font-style:normal}

/* ---------- settings + teams panel ---------- */
.panel{max-width:1400px;margin:14px auto 0;padding:0 16px}
.card{border:1px solid var(--line);border-radius:14px;background:rgba(8,15,34,.85);padding:12px 14px;margin-bottom:12px}
.card>h2{margin:0 0 8px;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;color:#cfe0ff;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.card>h2 small{font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);font-size:12.5px}
.card.fold>:not(h2){display:none}
.card>h2::before{content:'\25BE';font-size:12px;color:var(--muted)}
.card.fold>h2::before{content:'\25B8'}
.prow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:6px 0}
.prow label{display:flex;gap:6px;align-items:center;font-size:13.5px;color:#b8c7e6}
.prow .grp{display:flex;gap:4px;align-items:center}
.note{color:var(--muted);font-size:12.5px;line-height:1.5}
.clans{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.clan{display:flex;gap:6px;align-items:center;padding:3px 9px 3px 4px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);cursor:pointer;font-size:12.5px;font-weight:700}
.clan:hover{border-color:var(--green)}
.clan.used{opacity:.4}
.clan img,.clan .lt{width:22px;height:22px;border-radius:50%;object-fit:contain;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:11px}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px}
.seat{display:flex;gap:6px;align-items:center;padding:4px 6px;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:rgba(255,255,255,.04)}
.seat.sel{border-color:var(--green);box-shadow:0 0 10px rgba(25,211,122,.4)}
.seat.over{outline:2px dashed #fff}
.seat .no{width:24px;text-align:right;color:var(--muted);font-size:12px;font-weight:800}
.seat .grip{cursor:grab;color:var(--muted);letter-spacing:-3px;user-select:none}
.seat{min-width:0}
.seat input.nm{flex:1;min-width:0;width:0}
.seat input.tg{width:62px;text-transform:uppercase}
.seat .lg{width:32px;height:32px;flex:none;border-radius:8px;cursor:pointer;display:grid;place-items:center;overflow:hidden;outline:1px dashed rgba(255,255,255,.35);background:rgba(255,255,255,.06);font-weight:900;font-size:13px}
.seat .lg img{width:100%;height:100%;object-fit:contain}
.seat .lg.drag{outline-color:var(--green)}
.bench{margin-top:8px}
.bench>b{font-size:12.5px;color:var(--muted)}

/* ---------- stage ---------- */
.zoom{display:flex;gap:4px;justify-content:center;margin:4px 0 0}
.scroller{overflow:auto;padding:14px 10px 10px}
.sizer{margin:0 auto;overflow:hidden}
.stage{position:relative;width:max-content;padding:14px 20px 20px;transform-origin:top left}
svg.arrows{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
.sec{position:relative;z-index:1}
svg.arrows path{fill:none;stroke-width:2.4;stroke-linecap:round}
svg.arrows path.w{stroke:var(--green);filter:drop-shadow(0 0 4px rgba(25,211,122,.9))}
svg.arrows path.l{stroke:var(--red);filter:drop-shadow(0 0 4px rgba(255,59,87,.9))}
svg.arrows path.off{stroke:#7f8fb0;opacity:.35;stroke-dasharray:3 7}
svg.arrows circle.w{fill:var(--green)}svg.arrows circle.l{fill:var(--red)}svg.arrows circle.off{fill:#7f8fb0;opacity:.4}
.sec{margin-bottom:34px}
.sec>h2{margin:0 0 12px;font-size:20px;letter-spacing:3px;text-transform:uppercase;color:#fff;text-shadow:0 0 14px rgba(43,140,255,.6)}
.cols{display:flex;gap:54px;align-items:flex-start}
.col{width:280px;display:flex;flex-direction:column;gap:20px}
.colh{font-size:12px;letter-spacing:2.5px;color:var(--muted);font-weight:800;text-align:center;margin-bottom:-8px}
.tree{display:flex;gap:54px;align-items:stretch}
.tcol{width:260px;display:flex;flex-direction:column}
.tcol .colh{margin:0 0 6px}
.tbody{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.group{--gc:var(--blue);border:1.5px solid var(--gc);border-radius:14px;background:rgba(9,17,36,.88);overflow:hidden;box-shadow:0 0 18px color-mix(in srgb,var(--gc) 28%,transparent)}
.blue{--gc:var(--blue)}.green{--gc:var(--green)}.yellow{--gc:var(--yellow)}.red{--gc:var(--red)}.purple{--gc:var(--purple)}.cyan{--gc:var(--cyan)}.gold{--gc:var(--gold)}
.group>h3{margin:0;padding:7px 10px;text-align:center;font-size:21px;font-weight:900;letter-spacing:2px;color:#fff;background:linear-gradient(180deg,var(--gc),color-mix(in srgb,var(--gc) 50%,#000));text-shadow:0 1px 3px rgba(0,0,0,.55)}
.group>h3 small{font-size:13px;letter-spacing:1.2px;margin-left:8px;opacity:.95}
.gbody{padding:4px 0 8px;display:flex;flex-direction:column}
.match{position:relative;display:flex;gap:8px;align-items:center;margin:14px 10px 4px;padding:9px 8px;border:1.5px solid color-mix(in srgb,var(--gc) 70%,transparent);border-radius:12px;background:rgba(4,9,20,.82)}
.tree .match{margin:8px 0}
.match.bye{opacity:.45}
.match .mid{position:absolute;top:-9px;left:12px;background:#07102a;border:1px solid color-mix(in srgb,var(--gc) 60%,transparent);color:var(--gc);font-size:10px;font-weight:800;letter-spacing:1.5px;padding:1px 7px;border-radius:6px}
.slots{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.vs{font-size:9.5px;letter-spacing:3px;text-align:center;color:var(--muted);line-height:1;font-weight:700}
.slot{position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:4px 6px;border:1px solid rgba(255,255,255,.13);border-radius:9px;background:rgba(255,255,255,.045)}
.slot.empty{opacity:.6;border-style:dashed}
.slot.empty .name{font-style:italic;color:var(--muted);font-weight:500;font-size:12.5px}
.slot.win{border-color:var(--green);background:rgba(25,211,122,.14);box-shadow:0 0 11px rgba(25,211,122,.45)}
.slot.lose{border-color:rgba(255,59,87,.55);background:rgba(255,59,87,.07)}
.slot.lose .name,.slot.lose .logo{opacity:.5}
.slot.lose .name{text-decoration:line-through}
.slot.res{margin:8px 10px 0;background:color-mix(in srgb,var(--gc) 15%,transparent);border-color:var(--gc)}
.slot.champ{height:54px;border-color:var(--gold);background:rgba(255,176,32,.14);box-shadow:0 0 16px rgba(255,176,32,.5)}
.slot.champ .name{font-size:18px}
.logo{width:30px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.04));font-weight:900;font-size:14px;color:#cfe0ff}
.logo img{width:100%;height:100%;object-fit:contain}
.name{flex:1;min-width:0;font-weight:700;font-size:15px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name small{font-size:11px;color:var(--muted);margin-left:5px;font-weight:700}
.rec{font-size:11px;font-weight:800;color:var(--muted)}
input.sc{width:34px;height:26px;padding:0 2px;text-align:center;font-weight:800;font-size:14px;border-radius:6px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18)}
input.sc::-webkit-inner-spin-button{display:none}
.acts{position:absolute;right:46px;top:50%;transform:translateY(-50%);display:flex;gap:4px;padding:3px;background:rgba(7,14,32,.94);border-radius:9px;box-shadow:0 0 8px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .12s;z-index:3}
.slot:hover .acts,.slot:focus-within .acts{opacity:1;pointer-events:auto}
.acts button{width:25px;height:25px;border-radius:7px;border:1.5px solid;background:#0a1630;cursor:pointer;font-size:13px;line-height:1;padding:0}
.acts .ok{color:var(--green);border-color:var(--green)}.acts .no{color:var(--red);border-color:var(--red)}
.acts .ok.active{background:var(--green);color:#03140d}.acts .no.active{background:var(--red);color:#fff}
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;width:min(1360px,96vw)}
.rounds .group .match{margin:14px 10px 4px}
table.st{border-collapse:collapse;min-width:520px;font-size:14px;margin-bottom:6px}
table.st th{font-size:11px;letter-spacing:1.5px;color:var(--muted);text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
table.st td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
table.st td.n{text-align:center;font-weight:800}
table.st .tm{display:flex;gap:8px;align-items:center;font-weight:700}
table.st .tm .logo{width:24px;height:24px;font-size:11px}
table.st tr.q td:first-child{box-shadow:inset 3px 0 var(--green)}
table.st tr.e td:first-child{box-shadow:inset 3px 0 var(--red)}
.chip{padding:2px 9px;border-radius:7px;border:1.5px solid;font-weight:800;font-size:11px;letter-spacing:1px;white-space:nowrap}
.chip.q{color:var(--green);border-color:var(--green)}.chip.e{color:var(--red);border-color:var(--red)}.chip.t{color:var(--yellow);border-color:var(--yellow);cursor:pointer;background:none}
.wait{color:var(--muted);font-style:italic;font-size:13px;padding:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:50;background:#0d1a38;border:1px solid var(--blue);color:#fff;padding:11px 18px;border-radius:11px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:.25s;max-width:90vw;text-align:center}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.modal .box{background:#0d1a38;border:1px solid var(--blue);border-radius:14px;padding:18px 20px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.modal p{margin:0 0 14px;white-space:pre-line;line-height:1.5;font-size:15px}
.modal input{width:100%;margin-bottom:14px}
.mrow{display:flex;gap:8px;justify-content:flex-end}
.btn.trash{padding:3px 7px}
.filebar{max-width:1400px;margin:10px auto 0;padding:10px 14px;border:1px solid #ffb347;border-radius:12px;background:rgba(255,179,71,.08);color:#ffd59a;font-size:13.5px;text-align:center}
.filebar a{color:#fff;font-weight:800}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.bar{padding:8px}.panel{padding:0 8px}.seats{grid-template-columns:1fr}}
</style>
</head>

<script>
(function(){
'use strict';
const BYE = -1, MAXT = 64;
const RULES = {tbm:'Tie-breaker match', h2h:'Head-to-head', diff:'Score difference', for:'Score for', buch:'Buchholz (opponents’ record)'};
const FORMATS = {swiss:'Swiss', single:'Single elimination', double:'Double elimination', rr:'Round robin'};
// SERVED = opened from Scrim Overlay on this PC (Clans list, Back to Control). WEB = the online copy anyone can use
// (GitHub page, 2026-10-21): no PC, teams typed here. Neither = opened as a downloaded file.
const K = 'bracketTool.v2', WEB = /^https?:$/.test(location.protocol) && !/^(127\.0\.0\.1|localhost|\[::1\])$/.test(location.hostname),
  SERVED = /^https?:$/.test(location.protocol) && !WEB && /bracket\.html$/.test(location.pathname);
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;

/* ================= storage ================= */
function blankTeam(){ return {name:'', tag:'', logo:null}; }
function newBracket(teams){
  return { id:uid(), title:'Scrim Tournament', savedAt:Date.now(), format:'swiss', count:8,
    teams:(teams || []).map(t => ({...t})).concat(Array.from({length:Math.max(0, 8 - (teams || []).length)}, blankTeam)),
    opt:{wins:3, losses:3, seeding:'listed', playoff:'single', third:false, reset:true, rrTwice:false, rrGroups:1, rrAdvance:2, tb:['tbm','h2h','diff','buch']},
    results:{}, tbs:[] };
}
function fix(b){
  const d = newBracket();
  b = Object.assign(d, b || {}); b.opt = Object.assign(newBracket().opt, b.opt || {});
  if(!Array.isArray(b.teams)) b.teams = [];
  b.teams = b.teams.slice(0, MAXT).map(t => ({name:String(t && t.name || '').slice(0, 30), tag:String(t && t.tag || '').slice(0, 6), logo:t && t.logo || null}));
  b.count = Math.max(2, Math.min(MAXT, +b.count || 8));
  while(b.teams.length < b.count) b.teams.push(blankTeam());
  if(!FORMATS[b.format]) b.format = 'swiss';
  if(!b.results || typeof b.results !== 'object') b.results = {};
  if(!Array.isArray(b.tbs)) b.tbs = [];
  return b;
}
let S;
try{ S = JSON.parse(localStorage.getItem(K)); }catch(e){}
if(!S || !Array.isArray(S.list) || !S.list.length) S = {v:2, cur:null, list:[newBracket()], logos:{}, zoom:'fit'};
S.logos = S.logos || {}; S.list = S.list.map(fix);
if(!S.list.some(b => b.id === S.cur)) S.cur = S.list[0].id;
const cur = () => S.list.find(b => b.id === S.cur);
let EMB = null, askEmb = null; try{ EMB = JSON.parse($('#embedded-state').textContent || 'null'); }catch(e){}
if(EMB && EMB.bracket){
  Object.assign(S.logos, EMB.logos || {});
  const have = S.list.find(b => b.id === EMB.bracket.id);
  let seen = null; try{ seen = localStorage.getItem(K + '.seen'); }catch(e){}
  if(!have){ S.list.push(fix(EMB.bracket)); S.cur = EMB.bracket.id; }
  else if(seen !== EMB.stamp && (EMB.bracket.savedAt || 0) > (have.savedAt || 0)) askEmb = have;
  try{ localStorage.setItem(K + '.seen', EMB.stamp); }catch(e){}
}
let saveT = null, dirty = false;
function used(){ const u = new Set(); S.list.forEach(b => b.teams.forEach(t => t.logo && u.add(t.logo))); return u; }
function save(){
  const u = used(); Object.keys(S.logos).forEach(k => { if(!u.has(k)) delete S.logos[k]; });
  try{ localStorage.setItem(K, JSON.stringify(S)); dirty = false; status('✓ Auto-saved ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})); }
  catch(e){ status('⚠ Browser storage full – use Save & Share', true); }
}
function touch(){ cur().savedAt = Date.now(); dirty = true; clearTimeout(saveT); saveT = setTimeout(save, 200); }
function status(t, warn){ const el = $('#status'); if(el){ el.textContent = t; el.classList.toggle('warn', !!warn); } }
function dialog(msg, o){
  o = o || {};
  return new Promise(res => {
    const inp = o.input != null ? h('input', {type:'text', maxlength:'60', value:o.input}) : null;
    const done = v => { ov.remove(); res(v); };
    const yes = () => done(inp ? (inp.value.trim() || null) : true), no = () => done(inp ? null : false);
    const ov = h('div', {class:'modal', onclick:e => { if(e.target === ov) no(); }}, h('div', {class:'box'}, h('p', {}, msg), inp,
      h('div', {class:'mrow'}, h('button', {class:'btn primary', type:'button', onclick:yes}, o.yes || 'Yes'), h('button', {class:'btn', type:'button', onclick:no}, o.no || 'No'))));
    ov.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); yes(); } if(e.key === 'Escape') no(); });
    document.body.append(ov); (inp || ov.querySelector('button')).focus(); if(inp) inp.select();
  });
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 4200); }

/* logos: one small copy per picture, shared by all brackets */
function hash(s){ let h = 2166136261; for(let i = 0; i < s.length; i += 7) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return 'l' + (h >>> 0).toString(36) + s.length.toString(36); }
async function shrink(src, max){
  const img = new Image();
  await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = src; });
  const k = Math.min(1, (max || 160) / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const d = c.toDataURL('image/webp', .9);
  return d.indexOf('data:image/webp') === 0 ? d : c.toDataURL('image/png');
}
async function putLogo(src){ const d = await shrink(src); const k = hash(d); S.logos[k] = d; return k; }
const logoSrc = k => k && S.logos[k] || null;

/* clans from the overlay (/clans.html) when this page is served by Scrim Overlay; elsewhere (the online copy, a shared
   file) the snapshot built into the page (#builtin-clans, tools/publish-tools.js) */
let CLANS = [];
function loadClans(){
  if(!SERVED){ try{ CLANS = JSON.parse($('#builtin-clans').textContent || 'null') || []; }catch(e){} if(CLANS.length) renderPanel(); return; }
  try{
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws');
    ws.onopen = () => ws.send(JSON.stringify({type:'hello', channel:'live', role:'overlay'}));
    ws.onmessage = e => { const m = JSON.parse(e.data); if(m.type !== 'state') return;
      CLANS = ((m.state.modules || {}).clans || {}).list || []; ws.close(); renderPanel(); };
  }catch(e){}
}

/* ================= tournament logic ================= */
const tname = (B, s) => s === BYE ? 'BYE' : ((B.teams[s] && B.teams[s].name || '').trim() || 'Team ' + (s + 1));
function outcome(B, m){
  if(m.a == null || m.b == null) return {w:null, l:null};
  if(m.a === BYE && m.b === BYE) return {w:BYE, l:BYE, auto:1};
  if(m.a === BYE) return {w:m.b, l:BYE, auto:1};
  if(m.b === BYE) return {w:m.a, l:BYE, auto:1};
  const r = B.results[m.id]; if(!r) return {w:null, l:null};
  let w = r.w;
  if(w !== m.a && w !== m.b){ const sa = num(r.s && r.s[m.a]), sb = num(r.s && r.s[m.b]); w = (sa != null && sb != null && sa !== sb) ? (sa > sb ? m.a : m.b) : null; }
  return w == null ? {w:null, l:null} : {w:w, l:w === m.a ? m.b : m.a};
}
function seedOrder(P){ let a = [1]; while(a.length < P){ const n = a.length * 2; a = a.flatMap(x => [x, n + 1 - x]); } return a; }
const pow2 = n => { let p = 1; while(p < n) p *= 2; return p; };
/* entries: [{s, hint}] in bracket order, length = power of two */
function firstRound(n, listed, seatOf, hintOf){
  const P = pow2(Math.max(2, n)), out = [];
  if(listed){ const byes = P - n; let i = 0;
    for(let k = 0; k < P / 2; k++){ if(k < byes){ out.push(i++, BYE); } else { out.push(i++, i++); } } }
  else seedOrder(P).forEach(k => out.push(k <= n ? k - 1 : BYE));
  return out.map(i => i === BYE ? {s:BYE} : {s:seatOf(i), hint:hintOf(i)});
}
function mk(B, ctx, id, A, Bb, extra){
  const m = Object.assign({id:id, a:A.s === undefined ? null : A.s, b:Bb.s === undefined ? null : Bb.s, label:'M' + (++ctx.n)}, extra || {});
  m.ha = A.hint || (A.src ? (A.k === 'w' ? 'Winner ' : 'Loser ') + A.src.label : 'TBD');
  m.hb = Bb.hint || (Bb.src ? (Bb.k === 'w' ? 'Winner ' : 'Loser ') + Bb.src.label : 'TBD');
  m.srcA = A.k === 'w' ? A.src : null; m.srcB = Bb.k === 'w' ? Bb.src : null;
  m.o = outcome(B, m); ctx.all.push(m);
  return m;
}
const W_ = m => ({s:m.o.w, src:m, k:'w'}), L_ = m => ({s:m.o.w == null ? null : m.o.l, src:m, k:'l'});
function roundName(left, i, total){ return left === 2 ? 'Final' : left === 4 ? 'Semifinals' : left === 8 ? 'Quarterfinals' : 'Round ' + (i + 1); }
function buildSingle(B, ctx, entries, pre){
  const rounds = []; let prev = [];
  for(let i = 0; i < entries.length / 2; i++) prev.push(mk(B, ctx, pre + '1-' + (i + 1), entries[2 * i], entries[2 * i + 1], {round:1}));
  rounds.push(prev);
  while(prev.length > 1){ const r = rounds.length + 1, nx = [];
    for(let i = 0; i < prev.length / 2; i++) nx.push(mk(B, ctx, pre + r + '-' + (i + 1), W_(prev[2 * i]), W_(prev[2 * i + 1]), {round:r}));
    rounds.push(nx); prev = nx; }
  return rounds;
}
function buildElim(B, ctx, entries, pre, kind){
  const U = buildSingle(B, ctx, entries, pre + 'U'), k = U.length, out = {U:U, L:[], gf:[], third:null};

/* arrows */
function drawLinks(){
  if(!stage || !svg) return;
  const sr = stage.getBoundingClientRect(), k = (sr.width / stage.offsetWidth) || 1;
  const X = v => (v - sr.left) / k, Y = v => (v - sr.top) / k;
  svg.setAttribute('width', stage.offsetWidth); svg.setAttribute('height', stage.offsetHeight);
  let html = '';
  links.forEach(L => { if(!L.from || !L.to) return;
    const cr = L.from.getBoundingClientRect(), fr = (L.fromSlot || L.from).getBoundingClientRect(), tr = L.to.getBoundingClientRect();
    if(!cr.width || !tr.width) return;
    const x1 = X(cr.right), y1 = Y(fr.top + fr.height / 2), x2 = X(tr.left) - 3, y2 = Y(tr.top + tr.height / 2), dx = Math.max(22, (x2 - x1) * .5);
    html += '<path class="' + L.cls + '" d="M' + x1 + ' ' + y1 + ' C' + (x1 + dx) + ' ' + y1 + ' ' + (x2 - dx) + ' ' + y2 + ' ' + x2 + ' ' + y2 + '"/><circle class="' + L.cls + '" cx="' + x1 + '" cy="' + y1 + '" r="3.2"/>'; });
  svg.innerHTML = html;

function layout(){
  if(!stage) return;
  const sizer = stage.parentNode; stage.style.transform = 'none'; sizer.style.width = sizer.style.height = '';
  const w = stage.offsetWidth, hh = stage.offsetHeight, avail = sizer.parentNode.clientWidth - 20;
  const z = S.zoom === 'fit' ? Math.max(.45, Math.min(1, avail / w)) : +S.zoom || 1;

  sizer.style.width = Math.ceil(w * z) + 'px'; sizer.style.height = Math.ceil(hh * z) + 'px';
  $('#zl').textContent = S.zoom === 'fit' ? 'Fit (' + Math.round(z * 100) + '%)' : Math.round(z * 100) + '%';
  drawLinks();
}

async function importFile(f){

    h('div', {class:'zoom'},
      h('button', {class:'btn sm', type:'button', onclick:() => zoomBy(-.1)}, '−'), h('button', {class:'btn sm', type:'button', id:'zl', onclick:() => { S.zoom = 'fit'; save(); layout(); }}, 'Fit'),
      h('button', {class:'btn sm', type:'button', onclick:() => zoomBy(.1)}, '+'), h('span', {class:'note', style:'margin-left:8px'}, 'Hover a team: ✔ wins · ✖ loses · box = score (optional). Click again to undo.')),
    h('div', {class:'scroller'}, h('div', {class:'sizer'}, stage = h('div', {class:'stage'}))),
    h('input', {type:'file', id:'file', accept:'image/*', hidden:true, onchange:e => { const f = e.target.files[0]; e.target.value = ''; if(f && pickFor >= 0) setLogoFile(pickFor, f); }}),
    h('input', {type:'file', id:'imp', accept:'.html,.htm,.json', hidden:true, onchange:e => { const f = e.target.files[0]; e.target.value = ''; if(f) importFile(f); }}),
    h('div', {class:'toast', id:'toast'}));
  if('ResizeObserver' in window) new ResizeObserver(() => drawLinks()).observe(stage);
  addEventListener('resize', layout);
  addEventListener('beforeunload', () => { if(dirty) save(); });
  // Another tab of this tool saved: take its version, so two open tabs never overwrite each other.
  addEventListener('storage', e => { if(e.key !== K || !e.newValue) return;
    try{ const o = JSON.parse(e.newValue); if(o && Array.isArray(o.list) && o.list.length){ const z = S.zoom; S = o; S.logos = S.logos || {}; S.list = S.list.map(fix); S.zoom = z;
      if(!S.list.some(b => b.id === S.cur)) S.cur = S.list[0].id; dirty = false; renderAll(); } }catch(err){} });
}
function zoomBy(d){ const sr = stage.getBoundingClientRect(), z = S.zoom === 'fit' ? (sr.width / stage.offsetWidth) : +S.zoom; S.zoom = Math.max(.3, Math.min(1.6, Math.round((z + d) * 10) / 10)); save(); layout(); }
function renderAll(){ renderList(); renderPanel(); renderBracket(); }
build(); renderAll(); save(); loadClans();
if(askEmb) dialog('This file has a newer version of "' + (EMB.bracket.title || 'this bracket') + '".\nLoad it? (No = keep the one saved in this browser)', {yes:'Load it', no:'Keep mine'})
  .then(ok => { if(!ok) return; S.list[S.list.indexOf(askEmb)] = fix(EMB.bracket); S.cur = EMB.bracket.id; touch(); renderAll(); });
})();
</script>
