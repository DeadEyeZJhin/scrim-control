<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map Planner</title>
<!-- Map Planner (2026-10-21): plans per map, 5-hero lineups, hero skills with game icons, walls block the vision arc,
     smokes and wall skills block it too, ricochet (bank shot) paths, area names, Site A/B/C close-ups on the layout.
     One self-contained file: "Share" downloads a copy of this page with plans + pictures built in (no server needed).
     Skill sizes are ESTIMATES (the game tables are encrypted): tune them in "Skill sizes". -->
<style>
:root{--bg:#0b0f14;--pan:#121821;--pan2:#18202b;--line:#263140;--tx:#e8edf3;--mu:#8795a7;--ally:#3aa0ff;--enemy:#ff4655;--bomb:#f5b84a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 Bahnschrift,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:220px 1fr 280px;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button,select{background:var(--pan2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover,select:hover{border-color:#42536a}
:focus-visible{outline:2px solid var(--ally);outline-offset:1px}
a{color:inherit;text-decoration:none}
aside{background:var(--pan);display:flex;flex-direction:column;min-height:0;padding:0}
#side{border-right:1px solid var(--line)}
#props{border-left:1px solid var(--line);padding:14px;overflow:auto;gap:8px}
h1{margin:0;padding:14px 16px;font-size:19px;letter-spacing:.12em;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
h1 span{color:var(--enemy)}
h1 a{margin-left:auto;font-size:11px;letter-spacing:0;font-weight:400}
h3{margin:0 0 4px;font-size:16px}
#maps{overflow:auto;flex:1;padding:8px}
.map{padding:8px 10px;border:1px solid transparent;border-radius:8px;margin-bottom:4px}
.map.on{background:var(--pan2);border-color:var(--line)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mn{cursor:pointer;font-weight:600;flex:1}
.x{background:none;border:0;color:var(--mu);font-size:18px;line-height:1;padding:0 6px;border-radius:4px}
.x:hover{color:var(--enemy);background:none}
.chips{display:flex;gap:4px}
.chips button{flex:1;padding:4px 0;font-size:12px;color:var(--mu)}
.chips button.has{color:var(--tx);border-color:#42536a}
.chips button.on{background:var(--ally);color:#06121f;border-color:var(--ally);font-weight:700}
.foot{padding:10px;border-top:1px solid var(--line);display:grid;gap:6px}
.foot input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.foot small,.mu{color:var(--mu);font-size:12px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
#hdr{font-size:18px;font-weight:700}
#hdr i{font-style:normal;color:var(--mu);margin-left:8px;font-weight:400}
.lu{display:flex;align-items:center;gap:4px}
.lu b{font-size:12px;width:34px}
.lu.ally b{color:var(--ally)}.lu.enemy b{color:var(--enemy)}
.hs{width:34px;height:34px;border-radius:50%;padding:0;border:2px solid var(--line);background:#0b0f14 center/cover no-repeat;font-size:13px;color:var(--mu);position:relative}
.lu.ally .hs.has{border-color:var(--ally)}.lu.enemy .hs.has{border-color:var(--enemy)}
.hs small{position:absolute;bottom:-3px;right:-3px;background:var(--pan2);border-radius:50%;width:14px;height:14px;font-size:9px;line-height:14px;color:var(--tx)}
#skillbar{padding:6px 14px;border-bottom:1px solid var(--line);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;min-height:42px}
#skillbar .grp{display:flex;gap:3px;align-items:center;padding:2px 6px 2px 2px;border-radius:8px;background:var(--pan)}
#skillbar .grp img.hd{width:26px;height:26px;border-radius:50%}
.sk{width:30px;height:30px;padding:2px;border-radius:7px;background:#0b0f14;position:relative}
.sk small{position:absolute;right:-4px;bottom:-4px;min-width:13px;height:13px;border-radius:7px;background:var(--pan2);border:1px solid var(--line);font-size:9px;line-height:11px;color:var(--tx);font-weight:700;pointer-events:none}
.sk img{width:100%;height:100%;object-fit:contain;display:block}
.sk.on{background:#fff}.sk.on img{filter:invert(1)}
.ally .sk{border-color:#2c5f8f}.enemy .sk{border-color:#8f2c35}
#bar{padding:7px 14px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#bar .sp{flex:1}
#bar label{font-size:12.5px;color:var(--mu);display:flex;gap:4px;align-items:center}
#tools{display:flex;gap:4px;flex-wrap:wrap}
#tools button.on{background:#fff;color:#0b0f14;border-color:#fff}
#tools button[data-tool=ally].on{background:var(--ally);border-color:var(--ally)}
#tools button[data-tool=enemy].on{background:var(--enemy);border-color:var(--enemy)}
#tools button[data-tool=site].on,#tools button[data-tool=bomb].on{background:var(--bomb);border-color:var(--bomb)}
kbd{font:inherit;font-size:11px;opacity:.6;margin-left:5px}
#stage{flex:1;min-height:0;position:relative;container-type:size;display:grid;place-items:center;background:#070a0e}
svg{width:min(100cqw,100cqh);height:min(100cqw,100cqh);touch-action:none;user-select:none;display:block}
#miss{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--pan);border:1px solid var(--enemy);border-radius:8px;padding:10px 14px;max-width:90%;font-size:13px;text-align:center}
#miss code{color:var(--bomb)}
#tip{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:var(--pan);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12.5px;color:var(--mu);pointer-events:none}
#props label{display:grid;gap:3px;margin-bottom:8px;font-size:13px;color:var(--mu)}
#props label b{color:var(--tx);float:right}
#props input[type=text],#props select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
#props .row{display:flex;gap:6px;margin-bottom:6px}
#props .row button{flex:1}
#props .skrow{display:flex;gap:6px;margin:6px 0 10px}
#props .skhead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
#props .skhead img{width:40px;height:40px;object-fit:contain;background:#0b0f14;border-radius:8px;padding:3px}
#props .warn{color:var(--enemy);font-size:12.5px;margin-bottom:8px}
.help{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);color:var(--mu);font-size:12px;line-height:1.7}
#pick{position:fixed;z-index:30;background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;grid-template-columns:repeat(5,64px);gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#pick button{display:grid;gap:2px;justify-items:center;padding:4px 2px;font-size:11px}
#pick img{width:40px;height:40px;border-radius:50%}
#tune{position:fixed;inset:5% 8%;z-index:40;background:var(--pan);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.7)}
#tune header{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
#tune header b{font-size:17px}
#tune .body{overflow:auto;padding:10px 16px}
#tune table{border-collapse:collapse;width:100%;font-size:13px}
#tune th{font-size:11px;color:var(--mu);text-align:left;padding:4px 6px;position:sticky;top:0;background:var(--pan)}
#tune td{padding:3px 6px;border-top:1px solid var(--line)}
#tune td input{width:58px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:3px 5px}
#tune td select{padding:3px 5px}
#tune td img{width:26px;height:26px;object-fit:contain;vertical-align:middle;background:#0b0f14;border-radius:5px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--pan);border:1px solid var(--ally);border-radius:12px;padding:18px 20px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.modal p{margin:0 0 14px;white-space:pre-line;line-height:1.5;font-size:15px}
.modal input{width:100%;margin-bottom:14px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.mrow{display:flex;gap:8px;justify-content:flex-end}.mrow .yes{background:var(--ally);color:#06121f;border-color:var(--ally);font-weight:700}
@media(max-width:900px){body{grid-template-columns:150px 1fr}#props{display:none}}
</style>
</head>
<body>
<aside id="side">
  <h1>MAP<span>PLAN</span><a id="back" href="/control.html" hidden><button>Back to Control</button></a></h1>
  <div id="maps"></div>
  <div class="foot">
    <button id="addMap">+ Add map</button>
    <button id="loadImg">Load layout image</button>
    <input type="file" id="file" accept="image/*" hidden>
    <button id="gameImg" hidden title="Remove your own picture and show the game's layout again">Use game layout</button>
    <button id="tuneBtn" title="Sizes, ranges and icons of every hero skill (estimates: fix any number once, it is saved)">Skill sizes…</button>
    <button id="share" title="Download a copy of this planner with your plans, lineups and pictures built in">Share (download .html)</button>
    <button id="reshared" hidden title="Reset to the plans saved inside this file">Reload plans from this file</button>
    <div class="chips"><button id="export" title="Download plans + uploaded layouts as one file">Export backup</button><button id="import" title="Restore from a backup (.json) or a shared planner (.html)">Import</button></div>
    <input type="file" id="bk" accept=".json,.html,.htm,application/json,text/html" hidden>
    <small id="saved">Auto-saves in this browser</small>
  </div>
</aside>
<main>
  <div id="top"><div id="hdr"></div><div class="lu ally" id="luA"></div><div class="lu enemy" id="luE"></div></div>
  <div id="skillbar"></div>
  <div id="bar">
    <div id="tools"></div>
    <select id="form" title="Drop 5 players in a formation at the center of the view"><option value="">Formation…</option></select>
    <select id="rc" title="Route color"><option value="ally">Route: blue</option><option value="enemy">Route: red</option><option value="y">Route: yellow</option></select>
    <label title="Site A / B / C close-ups from the game on the layout"><input type="checkbox" id="tSites"> Sites</label>
    <label title="Your area names (Label tool)"><input type="checkbox" id="tLabels"> Names</label>
    <label title="Walls, cover boxes, smokes and wall skills cut the vision arc"><input type="checkbox" id="tBlock"> Walls block view</label>
    <label title="Move / resize the Site close-ups"><input type="checkbox" id="tEdit"> Edit sites</label>
    <span class="sp"></span>
    <button id="undo">Undo</button>
    <button id="fit">Reset view</button>
    <button id="clear" title="Clears this plan only (Undo brings it back)">Clear plan</button>
  </div>
  <div id="stage">
    <svg id="svg" viewBox="0 0 1000 1000">
      <defs>
        <marker id="mally" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3aa0ff"></path></marker>
        <marker id="menemy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff4655"></path></marker>
        <marker id="my" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f5b84a"></path></marker>
        <clipPath id="cc"><circle r="11"></circle></clipPath>
      </defs>
      <rect width="1000" height="1000" fill="#0f151d"></rect>
      <image id="bg" width="1000" height="1000" preserveAspectRatio="xMidYMid meet"></image>
      <g id="mapl"></g>
      <g id="layer"></g>
    </svg>
    <div id="miss" hidden></div>
    <div id="tip" hidden></div>
  </div>
</main>
<aside id="props"></aside>
<div id="pick" hidden></div>
<div id="tune" hidden><header><b>Skill sizes</b><span class="mu">Estimates in meters. Change a number once: new skills use it. Ricochet = how many times it bounces off walls.</span><span style="flex:1"></span>
  <label class="mu">Map scale <input type="number" id="uScale" min="2" max="30" step="0.5" style="width:60px"> units per meter</label>
  <button id="tuneAll" title="Give every skill already on the plans the sizes from this table">Apply to placed skills</button><button id="tuneClose">Close</button></header><div class="body" id="tuneBody"></div></div>

$('#skillbar').addEventListener('click',e=>{const b=e.target.closest('[data-sk]');if(!b)return;
  const same=tool==='skill'&&pend&&pend.k===b.dataset.sk&&pend.team===b.dataset.team&&pend.slot===+b.dataset.slot;
  if(same){setTool('select');return}pend={k:b.dataset.sk,team:b.dataset.team,slot:+b.dataset.slot};setTool('skill')});

/* ---------- panel + toolbar ---------- */
$('#props').addEventListener('focusin',e=>{if(e.target.dataset.k||e.target.dataset.pk)snap()});
$('#props').addEventListener('input',e=>{const t=e.target,k=t.dataset.k,pk=t.dataset.pk,it=sel&&find(sel);if((!k&&!pk)||!it)return;
  const v=t.type==='checkbox'?t.checked:t.type==='range'?+t.value:t.value;
  if(pk)it.p[pk]=pk==='block'?(v?1:0):v;else if(k==='h'){it.h=+v;if(it.h>=0)it.l=String(it.h+1);props();hdr()}else it[k]=v;
  if(t.type==='range'){const b=t.parentNode.querySelector('b');if(b)b.textContent=pk||k==='d'?mt(k==='d'?v/U():v):Math.round(v)}
  vcache.clear();render();save()});
$('#props').addEventListener('click',e=>{const sb=e.target.closest('[data-psk]');const it=sel&&find(sel);
  if(sb&&it){pend={k:sb.dataset.psk,team:it.t,slot:it.h,caster:it.id};setTool('skill');return}
  const a=e.target.dataset.act;if(!a||!it)return;snap();
  if(a==='del'){removeId(sel);sel=null}
  else if(a==='resetSites'){cur().sites=defSites(cur().name);sel=null}
  else{const c=JSON.parse(JSON.stringify(it));c.id=uid();if(c.pts)c.pts=c.pts.map(q=>[q[0]+30,q[1]+30]);else{c.x+=30;c.y+=30}
    (it.t==='label'?cur().labels:it.t==='msite'?cur().sites:items()).push(c);sel=c.id}
  all()});
$('#tools').innerHTML=TOOLS.map(t=>`<button data-tool="${t[0]}">${t[1]}<kbd>${t[2]}</kbd></button>`).join('');
$('#tools').onclick=e=>{const b=e.target.closest('[data-tool]');if(b)setTool(b.dataset.tool)};
$('#form').insertAdjacentHTML('beforeend',[['ally','Blue'],['enemy','Red']].map(([t,n])=>Object.keys(FORM).map(k=>`<option value="${t}:${k}">${n} · ${k}</option>`).join('')).join(''));
$('#form').onchange=e=>{const [team,name]=e.target.value.split(':');if(!team)return;snap();
  const cx=view.x+view.w/2,cy=view.y+view.w/2,sc=view.w/1000;
  FORM[name].forEach((o,slot)=>items().push({id:uid(),t:team,x:cx+o[0]*sc,y:cy+o[1]*sc,a:team==='ally'?-90:90,fov:70,r:160,v:true,h:slot,l:String(slot+1)}));
  e.target.value='';all()};
[['#tSites','sites'],['#tLabels','labels'],['#tBlock','block'],['#tEdit','edit']].forEach(([s,k])=>{const el=$(s);el.checked=!!S.set[k];
  el.onchange=()=>{S.set[k]=el.checked;if(k==='edit'&&el.checked&&!S.set.sites){S.set.sites=true;$('#tSites').checked=true}vcache.clear();sel=null;all()}});
$('#undo').onclick=undo;
$('#fit').onclick=()=>{view={x:0,y:0,w:1000};applyView()};
$('#clear').onclick=async()=>{if(items().length&&await dialog('Clear everything on this plan?\n(Undo brings it back)',{yes:'Clear plan',no:'Cancel'})){snap();cur().plans[S.plan]=[];sel=null;all()}};
async function delMap(mi){
  if(S.maps.length<2){await dialog('Keep at least one map.',{yes:'OK',no:null});return}
  if(!await dialog(`Delete "${S.maps[mi].name}" and all its plans?`,{yes:'Delete',no:'Cancel'}))return;
  const gone=S.maps.splice(mi,1)[0];
  if(custom[gone.id]){URL.revokeObjectURL(custom[gone.id]);delete custom[gone.id]}
  imgDel(gone.id);
  Object.keys(hist).forEach(k=>delete hist[k]);
  go(Math.min(S.map-(mi<S.map?1:0),S.maps.length-1),S.plan)}
$('#maps').onclick=e=>{const d=e.target.closest('[data-del]');if(d){delMap(+d.dataset.del);return}
  const b=e.target.closest('[data-m]');if(b)go(+b.dataset.m,b.dataset.p!=null?+b.dataset.p:S.plan)};
$('#addMap').onclick=async()=>{const n=await dialog('Name of the new map.\nA game map (Harbor, Junction, Outpost, Petra, Santorini, Slums, Practice Map) gets its game layout and walls. Any other name: use “Load layout image”.',{input:'',yes:'Add map',no:'Cancel'});if(!n)return;
  const d=DEF.find(x=>x[0].toLowerCase()===n.toLowerCase());S.maps.push(mk(d?d[0]:n.slice(0,30),d?d[1]:''));go(S.maps.length-1,0)};
$('#loadImg').onclick=()=>$('#file').click();
$('#gameImg').onclick=()=>{const id=cur().id;if(custom[id]){URL.revokeObjectURL(custom[id]);delete custom[id]}imgDel(id);loadImg();save()};
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const id=cur().id;
  if(custom[id])URL.revokeObjectURL(custom[id]);
  custom[id]=URL.createObjectURL(f);loadImg();
  imgPut(id,f).then(ok=>{if(!ok){const st=$('#saved');st.textContent='⚠ Image not saved (storage blocked) — use Export backup';st.style.color='var(--enemy)'}else save()})};

/* ---------- skill sizes table ---------- */
function tuneTable(){let h='<table><tr><th>Hero</th><th>Skill</th><th>Icon</th><th>Shape</th><th>Size (m)</th><th>Length</th><th>Width</th><th>Range</th><th>Angle °</th><th>Ricochet</th><th>Blocks view</th></tr>';
  HEROES.forEach(H=>H[3].forEach((s,n)=>{const k=H[0]+'.'+s[0],d=skDef(k),ps=PARAMS[d.shape],cell2=p=>`<td>${ps.includes(p)?`<input type="number" step="0.5" min="0" data-tk="${k}" data-p="${p}" value="${d[p]||0}">`:''}</td>`;
    h+=`<tr><td>${esc(H[1])}</td><td title="${esc(d.note||'')}">${n===2?'U':n+1}. ${esc(s[1])}</td><td><img src="${esc(asset(iconURL(d.icon)))}" alt=""> <select data-tk="${k}" data-p="icon">${ICONS.map(n=>`<option ${n===d.icon?'selected':''}>${n}</option>`).join('')}</select></td>
      <td><select data-tk="${k}" data-p="shape">${Object.entries(SHAPES).map(([v,t])=>`<option value="${v}" ${v===d.shape?'selected':''}>${t}</option>`).join('')}</select></td>
      ${['r','len','w','range','fov','bounces'].map(cell2).join('')}<td><input type="checkbox" data-tk="${k}" data-p="block" ${d.block?'checked':''}></td></tr>`}));
  $('#tuneBody').innerHTML=h+'</table><p class="mu">Range 0 = anywhere on the map (for example Mirage Smoke, placed from the minimap). Your numbers are saved in this browser and go inside Share files.</p>'}
$('#tuneBtn').onclick=()=>{$('#uScale').value=U();tuneTable();$('#tune').hidden=false};
$('#tuneClose').onclick=()=>{$('#tune').hidden=true;all()};
$('#uScale').onchange=e=>{S.set.u=Math.max(2,Math.min(30,+e.target.value||8));vcache.clear();render();save()};
$('#tuneBody').addEventListener('change',e=>{const t=e.target,k=t.dataset.tk,p=t.dataset.p;if(!k)return;const o=S.sk[k]=S.sk[k]||{};
  o[p]=t.type==='checkbox'?(t.checked?1:0):t.type==='number'?+t.value:t.value;
  if(p==='shape'){const d=skDef(k);PARAMS[d.shape].forEach(q=>{if(d[q]==null)o[q]={r:3,len:6,w:1,range:12,fov:40,bounces:0}[q]})}
  save();if(p==='shape'||p==='icon')tuneTable()});
$('#tuneAll').onclick=async()=>{if(!await dialog('Give every skill already placed (all maps, all plans) the sizes from this table?',{yes:'Apply',no:'Cancel'}))return;
  S.maps.forEach(m=>m.plans.forEach(pl=>pl.forEach(i=>{if(i.t!=='skill')return;const d=skDef(i.k);PARAMS[d.shape].forEach(k=>i.p[k]=d[k]||0);i.p.block=d.block?1:0;if(d.shape==='throw')i.d=Math.min(i.d,i.p.range*U())})));
  vcache.clear();all()};

/* ---------- backup / share: everything (plans + uploaded images + game pictures) ---------- */
const toURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const blobOf=async id=>{const b=await imgGet(id);if(b&&b.size)return b;if(custom[id]){try{return await (await fetch(custom[id])).blob()}catch(e){}}return null};
const pack=async()=>{const images={};for(const m of S.maps){const b=await blobOf(m.id);if(b)images[m.id]=await toURL(b)}return images};
async function small(u,max){if(ASSETS[u])return ASSETS[u];try{const b=await (await fetch(u)).blob(),src=URL.createObjectURL(b),im=new Image();
  await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=src});const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(src);return c.toDataURL('image/png')}catch(e){return null}}
async function packAssets(){const out={},add=async(u,max)=>{if(BUILTIN[u])return;const d=await small(u,max);if(d)out[u]=d};
  for(const H of HEROES){await add(headURL(H[0]),64);for(const s of H[3])await add(iconURL(skDef(H[0]+'.'+s[0]).icon),64)}
  for(const m of S.maps){if(!custom[m.id]&&m.file)await add(lk(m),2048);for(const s of m.sites)await add(s.img,512)}
  return out}
const valid=d=>d&&d.state&&Array.isArray(d.state.maps)&&d.state.maps.length;
async function restore(d){
  Object.keys(custom).forEach(k=>{URL.revokeObjectURL(custom[k]);delete custom[k]});
  for(const m of S.maps)await imgDel(m.id);
  Object.assign(ASSETS,d.assets||{});
  S=JSON.parse(JSON.stringify(d.state));norm();
  for(const id in d.images||{}){const b=await (await fetch(d.images[id])).blob();custom[id]=URL.createObjectURL(b);await imgPut(id,b)}
  Object.keys(hist).forEach(k=>delete hist[k]);syncToggles();go(S.map,S.plan)}
const download=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
const LT=String.fromCharCode(92)+'u003c';
$('#export').onclick=async()=>download(new Blob([JSON.stringify({v:2,state:S,images:await pack()})],{type:'application/json'}),'map-planner-backup.json');
$('#import').onclick=()=>$('#bk').click();
$('#bk').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const txt=await f.text(),m=txt.match(/<script[^>]*id="shared-data"[^>]*>([\s\S]*?)<\/script>/),d=JSON.parse(m?m[1]:txt);if(!valid(d))throw 0;
    if(!await dialog('Replace everything currently saved with this file?',{yes:'Replace',no:'Cancel'}))return;
    await restore(d)}
  catch(err){dialog('That file is not a valid Map Planner backup or shared planner.',{yes:'OK',no:null})}};
const stamp=()=>Date.now().toString(36)+uid();
$('#share').onclick=async()=>{const st=$('#saved');st.style.color='';st.textContent='Building shareable file…';
  try{const sid=stamp(),json=JSON.stringify({stamp:sid,state:S,images:await pack(),assets:await packAssets()}).replace(/</g,LT),
      html=TEMPLATE.replace(/(<script[^>]*id="shared-data"[^>]*>)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b),
      blob=new Blob([html],{type:'text/html'});
    download(blob,'map-planner-shared.html');
    try{localStorage.setItem(K+'.seen',sid)}catch(e){}
    st.textContent='Shareable file ready ('+(blob.size/1048576).toFixed(1)+' MB) — send it to your team'}
  catch(err){st.textContent='⚠ Could not build shareable file';st.style.color='var(--enemy)'}};
$('#reshared').onclick=async()=>{if(SH&&await dialog('Replace your current plans with the ones saved inside this file?',{yes:'Replace',no:'Cancel'}))await restore(SH)};
function syncToggles(){$('#tSites').checked=!!S.set.sites;$('#tLabels').checked=!!S.set.labels;$('#tBlock').checked=!!S.set.block;$('#tEdit').checked=!!S.set.edit}
if(SERVED)$('#back').hidden=false;

addEventListener('keydown',e=>{
  if(e.target.matches('input,select'))return;
  if(e.code==='Space'){space=true;e.preventDefault();return}
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();undo();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if((k==='delete'||k==='backspace')&&sel){snap();removeId(sel);sel=null;all();return}
  if(k==='escape'){sel=null;$('#pick').hidden=true;$('#tune').hidden=true;setTool('select');all();return}
  if(k>='1'&&k<='5'){go(S.map,+k-1);return}
  const t=TOOLS.find(t=>t[2].toLowerCase()===k);if(t)setTool(t[0])});
addEventListener('keyup',e=>{if(e.code==='Space')space=false});
addEventListener('storage',e=>{if(e.key!==K||!e.newValue||drag)return;try{const o=JSON.parse(e.newValue);if(o&&o.maps&&o.maps.length){S=o;norm();sel=null;syncToggles();go(S.map,S.plan)}}catch(err){}});

setTool('select');all();
(async()=>{
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  for(const m of S.maps){const b=await imgGet(m.id);if(b&&b.size)custom[m.id]=URL.createObjectURL(b)}
  if(SH){$('#reshared').hidden=false;
    let seen=null;try{seen=localStorage.getItem(K+'.seen')}catch(e){}
    if(seen!==SH.stamp){
      const mine=S.maps.some(m=>m.plans.some(p=>p.length))||Object.keys(custom).length>0;
      if(!mine||await dialog('This file contains plans and layouts shared with you.\nLoad them? (This replaces the plans saved in this browser.)',{yes:'Load them',no:'Keep mine'}))await restore(SH);
      try{localStorage.setItem(K+'.seen',SH.stamp)}catch(e){}}}
  loadImg();all()})().catch(loadImg);
addEventListener('pagehide',save);
</script></body></html>
